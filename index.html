<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Upload a CSV of course sections and visualize conflict density 
        across days and times to pick optimal event slots." />
        <title>Class Scheduling Web App</title>
        <link rel=""stylesheet" href="CSS/style.css"/>
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

        <script type="module">
            import { state, initControls } from './JS/state.js';
            import { loadCSV } from './JS/parse.js';
            import { aggregate } from './JS/aggregate.js';
            import { renderAll } from './JS/charts.js'

            // process CSV input
            const fileInput = document.getElementById('file');
            fileInput.addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                const txt = await file.text();
                
                // return an object with rows, skipped, and depts. 
                const parsedData = await loadCSV(txt);
                state.rows = parsedData.rows;
                
                // populate the list for department filtering
                const deptList = document.getElementById('deptList');
                if (deptList) {
                    deptList.innerHTML = parsedData.depts.map(d => `<option value="${d}"></option>`).join('');
                }
                
                rerender();
            });

            // handle redrawing data visualizations
            function rerender() {
                const agg = aggregate(state);
                renderAll(agg, state);
            }

            initControls(state, rerender);
        </script>
    </head>
    <body>
        <header>
            <h1>Class Scheduling Visualizer</h1>
            <p class="sub">Upload a CSV with course sections to visualize conflict density.</p>
        </header>
        
        <div class="controls">
            <label>
                <span>Upload CSV</span>
                 <input id="file" type="file" accept=".csv" />
            </label>
            <label>
                <span>Bucket Size (hour)</span>
                <select id="bucket">
                    <option value="60" selected>1 hour</option>
                    <option value="90">1.5 Hours</option>
                    <option value="120">2 Hours</option>
                    <option value="120">2.5 Hours</option>
                    <option value="180">3 Hours</option>
                    <option value="240">4 Hours</option>
                    <option value="300">5 Hours</option>
                </select>
            </label>
            <label>
                <span>Days</span>
                <select id="days" multiple>
                    <option value="Mon" selected>Monday</option>
                    <option value="Tue" selected>Tuesday</option>
                    <option value="Wed" selected>Wednesday</option>
                    <option value="Thu" selected>Thursday</option>
                    <option value="Fri" selected>Friday</option>
                </select>
            </label>
            <label>
                <span>Department</span>
                <input id="department" type="text" list="deptList" placeholder="All" />
                <datalist id="deptList"></datalist>
            </label>
            <label>
                <span>Weight By</span>
                <select id="weight">
                    <option value="enrolled" selected>Enrollment</option>
                    <option value="count">Class Count</option>
                </select>
            </label>
        </div>

        <main>
            <div class="viz">
                <canvas id="barChart"></canvas>
            </div>
            <div class="viz">
                <svg id="heatmap" width="800" height="400"></svg>
            </div>
            <div class="panel" id="topSlots"></div>
        </main> 
       
    </body>
</html>
