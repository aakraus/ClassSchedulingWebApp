<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Upload a CSV of course sections and visualize conflict density 
        across days and times to pick optimal event slots." />
        <title>Class Scheduling Web App</title>
        <link rel="stylesheet" href="CSS/style.css"/>
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

        <script type="module">
            import { state, initControls } from './JS/state.js';
            import { loadCSV } from './JS/parse.js';
            import { aggregate } from './JS/aggregate.js';
            import { renderAll } from './JS/charts.js'

            // process CSV input
            const fileInput = document.getElementById('file');
            fileInput.addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                const txt = await file.text();
                
                // return an object with rows, skipped, and depts. 
                const parsedData = await loadCSV(txt);
                state.rows = parsedData.rows;
                
                // populate the list for department filtering
                const deptGroup = document.getElementById('deptGroup');
                if (deptGroup) {
                    deptGroup.innerHTML = parsedData.depts.map(d => `<label><input type="checkbox" value="${d}"> ${d}</label>`).join('');
                }
                
                rerender();
            });

            // handle redrawing data visualizations
            function rerender() {
                const agg = aggregate(state);
                renderAll(agg, state);
            }

            initControls(state, rerender);
        </script>
    </head>
    <body>
        <header>
            <h1>Class Scheduling Visualizer</h1>
            <p class="sub">Upload a CSV with course sections to visualize conflict density.</p>
        </header>
        
    <div class="controls">
        <div class="control-card">
            <span>Upload CSV</span>
            <input id="file" type="file" accept=".csv" />
        </div>
    
        <div class="control-card">
            <span>Bucket Size (Duration)</span>
            <select id="bucket">
                <option value="60" selected>1 Hour</option>
                <option value="90">1.5 Hours</option>
                <option value="120">2 Hours</option>
                <option value="150">2.5 Hours</option>
                <option value="180">3 Hours</option>
                <option value="240">4 Hours</option>
                <option value="300">5 Hours</option>
            </select>
        </div>

        <div class="control-card">
            <span>Days</span>
            <div class="checkbox-group" id="daysGroup">
                <label><input type="checkbox" value="Mon" checked> Monday</label>
                <label><input type="checkbox" value="Tue" checked> Tuesday</label>
                <label><input type="checkbox" value="Wed" checked> Wednesday</label>
                <label><input type="checkbox" value="Thu" checked> Thursday</label>
                <label><input type="checkbox" value="Fri" checked> Friday</label>
            </div>
        </div>

        <div class="control-card">
            <span>Departments</span>
            <div class="checkbox-group" id="deptGroup">
                <em style="font-size:12px; color:gray;">Upload CSV to view</em>
            </div>
        </div>

        <div class="control-card">
            <span>Weight By</span>
            <select id="weight">
                <option value="enrolled" selected>Enrollment</option>
                <option value="count">Class Count</option>
            </select>
        </div>
    </div>

    <main>
        <div class="viz">
            <canvas id="barChart"></canvas>
        </div>
        <div class="viz">
            <svg id="heatmap" width="800" height="400"></svg>
        </div>
        <div class="panel" id="topSlots"></div>
    </main> 
       
    </body>
</html>
